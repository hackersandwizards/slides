# Publishes the catalog at https://hackersandwizards.github.io/slides/ (Benedikt 01.11., os row
# catalogue-addresses: a public repo may have a public page) through scaffolding's reusable
# workflow, which runs `bun run build` and publishes dist/.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@8579cd83fa4888f1799d2568f1f78bac94c40e69 # v0.3.3
    permissions:
      contents: read
      pages: write
      id-token: write
