# Publishes the catalog at https://hackersandwizards.github.io/slides/ (Benedikt 01.11., os row
# catalogue-addresses: a public repo may have a public page) through scaffolding's reusable
# workflow, which runs `bun run build` and publishes dist/.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@057e870d873c5431f15bcdf53450f463019a766c # v0.3.2
    permissions:
      contents: read
      pages: write
      id-token: write
